<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Management Dashboard</title>
  <meta name="description" content="Prototype dashboard for managing PC / gaming units — status, live sessions, utilization." />
  <link rel="preconnect" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-available" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-in-use" viewBox="0 0 24 24"><path d="M3 12h4l2 6 4-14 2 8h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-maintenance" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L4 16.8 7.2 20l5.3-5.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.3-.6-.6-2.3 2.5-2.7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-offline" viewBox="0 0 24 24"><path d="M12 3v9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <div class="brand__text">
          <h1>Unit Management</h1>
          <p>PC &amp; gaming station control</p>
        </div>
      </div>
      <div class="topbar__tools">
        <label class="search" title="Search units">
          <svg class="search__icon" width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search unit, zone, customer…" autocomplete="off" aria-label="Search units" />
        </label>
        <button id="addBtn" class="btn btn--primary" type="button">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-plus"/></svg>
          <span>Add unit</span>
        </button>
        <button id="themeBtn" class="btn btn--icon" type="button" title="Toggle theme" aria-label="Toggle color theme">
          <svg class="only-light" width="18" height="18" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="only-dark" width="18" height="18" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- KPI row -->
      <section class="stats" aria-label="Fleet summary">
        <article class="tile tile--hero">
          <span class="tile__label">Occupancy</span>
          <span class="tile__value" id="kpiOccupancy">—</span>
          <span class="tile__sub" id="kpiOccupancySub">— of — usable units in session</span>
          <div class="meter" role="img" aria-label="Occupancy meter">
            <div class="meter__fill" id="kpiOccupancyMeter" style="width:0%"></div>
          </div>
        </article>
        <article class="tile"><span class="tile__label">Total units</span><span class="tile__value" id="kpiTotal">—</span><span class="tile__sub" id="kpiZones">— zones</span></article>
        <article class="tile"><span class="tile__label"><i class="dot dot--in-use"></i>In use</span><span class="tile__value" id="kpiInUse">—</span><span class="tile__sub">active sessions</span></article>
        <article class="tile"><span class="tile__label"><i class="dot dot--available"></i>Available</span><span class="tile__value" id="kpiAvailable">—</span><span class="tile__sub">ready now</span></article>
        <article class="tile"><span class="tile__label"><i class="dot dot--offline"></i>Down</span><span class="tile__value" id="kpiDown">—</span><span class="tile__sub">maintenance / offline</span></article>
        <article class="tile"><span class="tile__label">Revenue today</span><span class="tile__value" id="kpiRevenue">—</span><span class="tile__sub" id="kpiSessions">— sessions closed</span></article>
      </section>

      <!-- Status distribution -->
      <section class="dist" aria-label="Status distribution">
        <div class="dist__head">
          <h2>Fleet status</h2>
          <div class="legend" id="legend"></div>
        </div>
        <div class="dist__bar" id="distBar" role="img" aria-label="Distribution of unit statuses"></div>
      </section>

      <!-- Controls -->
      <section class="controls">
        <div class="chips" id="statusChips" role="tablist" aria-label="Filter by status"></div>
        <div class="controls__right">
          <label class="select">
            <span>Zone</span>
            <select id="zoneFilter" aria-label="Filter by zone"><option value="all">All zones</option></select>
          </label>
          <label class="select">
            <span>Sort</span>
            <select id="sortBy" aria-label="Sort units">
              <option value="id">Unit ID</option>
              <option value="status">Status</option>
              <option value="zone">Zone</option>
              <option value="session">Session time</option>
            </select>
          </label>
        </div>
      </section>

      <!-- Grid -->
      <section id="grid" class="grid" aria-label="Units"></section>
      <p id="emptyState" class="empty" hidden>No units match these filters.</p>
    </main>

    <footer class="foot">
      <span id="footStamp">Prototype</span>
      <span class="foot__sep">·</span>
      <button id="seedBtn" class="linklike" type="button">Reset demo data</button>
    </footer>
  </div>

  <!-- Modal host -->
  <div id="modalHost" class="modal" hidden>
    <div class="modal__scrim" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__head">
        <h2 id="modalTitle">Title</h2>
        <button class="btn btn--icon" type="button" data-close aria-label="Close">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
